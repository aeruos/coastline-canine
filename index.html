    .badge {

    }

    .hero p {

      margin-bottom: 2rem;
    }

    .hero-actions {

      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background-color: var(--coral);
      color: var(--white);
      padding: 0.9rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--coral-dark);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.14);
      color: var(--white);

      border-radius: 8px;
      text-decoration: none;

      font-size: 1.05rem;

    }

      font-size: 2rem;
      color: var(--navy);
      margin-bottom: 0.65rem;
    }

    .section-header p {
      color: var(--muted);
      font-size: 1.05rem;
    }
